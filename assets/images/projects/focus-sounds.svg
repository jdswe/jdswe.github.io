<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Focus Sounds</title>
  <desc id="description">Abstract cover for the Focus Sounds web application.</desc>
  <defs>
